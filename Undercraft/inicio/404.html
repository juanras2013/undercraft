<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 | No encontrado</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #000;
        color: #0ff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .scanlines {
        position: absolute;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0, 255, 255, 0.05),
            rgba(0, 255, 255, 0.05) 1px,
            transparent 2px,
            transparent 3px
        );
        pointer-events: none;
    }

    h1 {
        font-size: 90px;
        font-weight: 900;
        letter-spacing: 4px;
        margin: 0;
        text-shadow: 0 0 20px #0ff;
    }

    p {
        font-size: 20px;
        margin: 10px 0 30px 0;
        opacity: 0.8;
    }

    a {
        padding: 12px 25px;
        border: 2px solid #0ff;
        color: #0ff;
        text-decoration: none;
        font-size: 18px;
        letter-spacing: 1px;
        transition: 0.25s;
    }

    a:hover {
        background: #0ff;
        color: #000;
        box-shadow: 0 0 20px #0ff;
    }

    .glow {
        animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
        0% { text-shadow: 0 0 10px #0ff; }
        50% { text-shadow: 0 0 30px #0ff; }
        100% { text-shadow: 0 0 10px #0ff; }
    }
</style>
</head>

<body>
<div class="scanlines"></div>

<h1 class="glow">404</h1>
<p>Página no encontrada en esta dimensión.</p>

<a href="/">Volver al inicio</a>

</body>
</html>
